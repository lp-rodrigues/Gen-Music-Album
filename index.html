<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Music Album</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: rgba(20, 20, 25, 0.75);
            --accent-color: #007aff;
            --success-color: #34c759;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        /* Ambient Fluid Background Canvas Layer */
        #art-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        /* Minimalistic Foreground Overlay HUD */
        #art-hud {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 2;
            pointer-events: none;
            user-select: none;
        }

        #art-hud h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            opacity: 0.8;
        }

        #status-text {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.4;
            transition: color 0.3s;
        }

        /* Dynamic Floating Cursor Tracker Interaction Dot */
        #glow-pointer {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            left: 50%;
            top: 50%;
        }

        /* Slide-Out Engineering Panel Infrastructure Drawer Toggle */
        #drawer-toggle {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s, transform 0.1s;
        }

        #drawer-toggle:hover { background: rgba(255, 255, 255, 0.18); }
        #drawer-toggle:active { transform: scale(0.95); }

        #tech-drawer {
            position: absolute;
            top: 0;
            right: -380px;
            width: 380px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 9;
            box-sizing: border-box;
            padding: 40px;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        #tech-drawer.open { right: 0; }

        .drawer-header {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* Stream Play/Stop Switch Inside the Control Panel */
        #main-art-toggle {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 14px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 30px;
        }

        #main-art-toggle:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
        }

        #main-art-toggle.active-stream {
            background: var(--success-color);
            border-color: var(--success-color);
            color: #ffffff;
        }
        #main-art-toggle.active-stream:hover {
            background: #28a745;
            border-color: #28a745;
            box-shadow: 0 4px 20px rgba(52,199,89,0.3);
        }

        .control-group { margin-bottom: 24px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 8px;}
        .slider-wrap { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: var(--accent-color); cursor: pointer; }
        .val-disp { font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.4); min-width: 24px;}
        
        .deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .deck button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; font-size: 11px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .deck button:hover { background: rgba(255,255,255,0.1); }
        .deck button.active { background: var(--accent-color); border-color: var(--accent-color); }

        /* Tech Readout Terminal Monitors */
        .terminal-panel {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 14px;
            margin-top: 10px;
        }

        .terminal-line {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.4);
        }

        #live-vector-display {
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-color);
            font-weight: bold;
            letter-spacing: 0px;
            text-transform: none;
            margin-top: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
</head>
<body>

    <canvas id="art-surface"></canvas>
    <div id="glow-pointer"></div>

    <div id="art-hud">
        <h1>Generative Music Album</h1>
        <div id="status-text">Connecting Local Matrices...</div>
    </div>

    <button id="drawer-toggle">⚙︎</button>

    <div id="tech-drawer">
        <div class="drawer-header">Diagnostic Parameters</div>

        <button id="main-art-toggle">Initialize Space</button>

        <div class="control-group">
            <label>Audition Original Layers</label>
            <div class="deck">
                <button id="midi1-btn">Track 1</button>
                <button id="midi2-btn">Track 2</button>
                <button id="midi3-btn">Track 3</button>
            </div>
        </div>

        <div class="control-group">
            <label>Master Tempo Control (BPM)</label>
            <div class="slider-wrap">
                <input type="range" id="tempo-slider" min="20" max="200" value="120">
                <span class="val-disp" id="tempo-val">120</span>
            </div>
        </div>

        <div class="control-group">
            <label>Entropy Coefficient (Chaos)</label>
            <div class="slider-wrap">
                <input type="range" id="chaos-slider" min="0.00" max="1.00" step="0.01" value="0.05">
                <span class="val-disp" id="chaos-val">0.05</span>
            </div>
        </div>

        <div class="control-group">
            <label>Barycentric Distribution Vector Coordinates</label>
            <div id="blend-display-debug" style="font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.4);">W1:33% | W2:33% | W3:33%</div>
            <canvas id="blend-triangle" width="280" height="120" style="display:none;"></canvas>
            <div id="triangle-dot" style="display:none;"></div>
        </div>

        <div class="control-group" style="margin-top: 35px;">
            <label>Active Engine Vector Monitor</label>
            <div class="terminal-panel">
                <div class="terminal-line">
                    <span>Target State Matrix Readout:</span>
                    <div id="live-vector-display">Engine Standby // Suspended</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Drawer toggle mechanic helper layout script
        const drawer = document.getElementById('tech-drawer');
        const toggleBtn = document.getElementById('drawer-toggle');
        toggleBtn.addEventListener('click', () => drawer.classList.toggle('open'));
    </script>
    <script src="app.js"></script>
</body>
</html>
