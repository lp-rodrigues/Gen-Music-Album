<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neverending Lullaby - Luís Rodrigues</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(15, 15, 20, 0.85);
            --accent-color: #007aff;
            --success-color: #34c759;
            --warning-color: #ff9500;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #art-hud {
            position: absolute; top: 40px; left: 40px; z-index: 2; pointer-events: none; user-select: none;
        }
        #art-hud h1 { font-size: 22px; font-weight: 300; letter-spacing: 3px; margin: 0 0 6px 0; text-transform: uppercase; opacity: 0.8; }

        #drawer-toggle {
            position: absolute; top: 40px; right: 40px; z-index: 10;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }

        #tech-drawer {
            position: absolute; top: 0; right: -380px; width: 380px; height: 100%;
            background: var(--panel-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.1); z-index: 9;
            box-sizing: border-box; 
            padding: 85px 40px 40px 40px;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto;
        }
        #tech-drawer.open { right: 0; }

        #main-art-toggle { width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; padding: 14px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-radius: 8px; cursor: pointer; margin-bottom: 12px; transition: all 0.2s; }
        #main-art-toggle.active-stream { background: var(--success-color); border-color: var(--success-color); }
        
        #lock-toggle-btn {
            width: 100%; background: rgba(255, 149, 0, 0.1); border: 1px solid var(--warning-color); color: var(--warning-color);
            padding: 12px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 6px; cursor: pointer; margin-bottom: 25px; transition: all 0.2s;
        }
        #lock-toggle-btn.unlocked {
            background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.6);
        }

        .drawer-header { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255, 255, 255, 0.4); margin-bottom: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }

        .control-group { margin-bottom: 24px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 8px;}
        .slider-wrap { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: var(--accent-color); cursor: pointer; }
        .val-disp { font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.4); min-width: 30px; text-align: right; }
        
        .deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .deck button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; font-size: 11px; border-radius: 6px; cursor: pointer; }

        /* Individual Border Colors */
        #midi1-btn { border-color: #050505; }
        #midi2-btn { border-color: #050505; }
        #midi3-btn { border-color: #050505; }

        /* Active States: Solid colors for background and border */
        #midi1-btn.active { background: #ff3b30; border-color: #ff3b30; color: #000; }
        #midi2-btn.active { background: #ffcc00; border-color: #ffcc00; color: #000; }
        #midi3-btn.active { background: #007aff; border-color: #007aff; color: #fff; }

        .deck button.active { background: var(--accent-color); border-color: var(--accent-color); }

        /* Color mapping for the Song buttons */
        #midi1-btn.active { background-color: #ff3b30 !important; color: #fff !important; }
        #midi2-btn.active { background-color: #ffcc00 !important; color: #000 !important; }
        #midi3-btn.active { background-color: #007aff !important; color: #fff !important; }

        .terminal-panel { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 14px; margin-top: 10px; }
        .terminal-line { display: flex; flex-direction: column; font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 8px; }
        #status-text { font-family: monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.3); font-weight: bold; margin-top: 4px; }
        #live-vector-display { font-family: monospace; font-size: 12px; color: var(--accent-color); font-weight: bold; margin-top: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
</head>
<body>

    <canvas id="art-surface"></canvas>

    <div id="art-hud">
        <h1>Neverending Lullaby</h1>
        <p style="font-size: 14px; letter-spacing: 1.5px; opacity: 0.6; margin: 0; text-transform: uppercase;">By Luís Rodrigues</p>
    </div>

    <button id="drawer-toggle">⚙︎</button>

    <div id="tech-drawer">
        <button id="main-art-toggle">Start Sound</button>

        <div class="control-group">
            <label>System Engine Monitor</label>
            <div class="terminal-panel">
                <div class="terminal-line">
                    <span>System Hardware Status:</span>
                    <div id="status-text">Booting Matrix...</div>
                </div>
                <div class="terminal-line">
                    <span>Key Normalisation:</span>
                    <div style="font-family:monospace; font-size:11px; margin-top:5px; display:flex; flex-direction:column; gap:3px;">
                        <div><span style="color:#ff3b30; font-weight:600;">Song 1</span> <span id="k1" style="color:rgba(255,255,255,0.5);">—</span></div>
                        <div><span style="color:#ffcc00; font-weight:600;">Song 2</span> <span id="k2" style="color:rgba(255,255,255,0.5);">—</span></div>
                        <div><span style="color:#007aff; font-weight:600;">Song 3</span> <span id="k3" style="color:rgba(255,255,255,0.5);">—</span></div>
                    </div>
                </div>
                <div class="terminal-line">
                    <span>Current Chord State:</span>
                    <div id="live-vector-display">Engine Standby</div>
                </div>
            </div>
        </div>

        <button id="lock-toggle-btn">🔒 System Automation: LOCKED</button>

        <div class="control-group">
            <label>Audition Original Layers</label>
            <div class="deck">
                <button id="midi1-btn">Song 1</button>
                <button id="midi2-btn">Song 2</button>
                <button id="midi3-btn">Song 3</button>
            </div>
        </div>

        <div class="control-group">
            <label>Manual Track Balance</label>
            <div id="manual-weight-sliders" style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                <div class="slider-wrap">
                    <span style="font-size:10px; min-width:40px; color:#ff3b30; font-weight: 600;">Song 1</span>
                    <input type="range" id="w1-slider" min="0" max="100" value="33" disabled>
                    <span class="val-disp" id="w1-val">33%</span>
                </div>
                <div class="slider-wrap">
                    <span style="font-size:10px; min-width:40px; color:#ffcc00; font-weight: 600;">Song 2</span>
                    <input type="range" id="w2-slider" min="0" max="100" value="33" disabled>
                    <span class="val-disp" id="w2-val">33%</span>
                </div>
                <div class="slider-wrap">
                    <span style="font-size:10px; min-width:40px; color:#007aff; font-weight: 600;">Song 3</span>
                    <input type="range" id="w3-slider" min="0" max="100" value="34" disabled>
                    <span class="val-disp" id="w3-val">34%</span>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>MONTH (Key)</label>
            <select id="key-selector" style="width:100%; background:#111; color:white; padding:8px; border:1px solid #333; border-radius:4px; font-size:11px;">
                <option value="0">January (C maj / A min)</option>
                <option value="1">February (G maj / E min)</option>
                <option value="2">March (D maj / B min)</option>
                <option value="3">April (A maj / F# min)</option>
                <option value="4">May (E maj / C# min)</option>
                <option value="5">June (B maj / G# min)</option>
                <option value="6">July (F# maj / D# min)</option>
                <option value="7">August (Db maj / Bb min)</option>
                <option value="8">September (Ab maj / F min)</option>
                <option value="9">October (Eb maj / C min)</option>
                <option value="10">November (Bb maj / G min)</option>
                <option value="11">December (F maj / D min)</option>
            </select>
        </div>

        <div class="control-group">
            <label>MOON DISTANCE (Tempo)</label>
            <input type="range" id="tempo-slider" min="25" max="100" value="60" style="width:100%" disabled>
            <div id="mon-bpm-label" style="font-size: 11px; margin-top:5px; color:rgba(255,255,255,0.5);">BPM: 60 | Distance: 384,000km</div>
        </div>

        <div class="control-group">
            <label>MOON PHASE (Timbre)</label>
            <input type="range" id="test-phase" min="0" max="1" step="0.01" value="0.5" style="width:100%" disabled>
            <div id="celestial-monitor" style="font-size: 11px; color: #888; font-family: monospace;">
                Phase: <span id="mon-phase">—</span> | Freq: <span id="mon-freq">—</span>Hz | Distort: <span id="mon-distort">—</span>
            </div>
        </div>

    </div>

    <script>
        const drawer = document.getElementById('tech-drawer');
        document.getElementById('drawer-toggle').addEventListener('click', () => drawer.classList.toggle('open'));
    </script>
    <script src="app.js"></script>
</body>
</html>
