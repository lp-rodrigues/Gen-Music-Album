<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Engine Markov Arranger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container" style="width: 360px;">
        <h1>Markov Multi-Engine</h1>
        <div class="status-card">
            <div style="margin-bottom: 4px;">Status: <span id="status-text" class="loading">Parsing Tracks...</span></div>
            <div style="font-size: 0.75rem; color: #aaa;">
                Active Chord: <span id="chord-text" style="color: #03dac6;">None</span>
            </div>
        </div>

        <div class="control-panel">
            <button id="play-btn">Start Orchestrated Stream</button>
            
            <div class="button-row" style="display: flex; gap: 10px; margin-top: -5px;">
                <button id="midi1-btn" style="background-color: #3700b3; color: white; flex: 1; font-size: 0.85rem; padding: 10px;">Play Orig 1</button>
                <button id="midi2-btn" style="background-color: #3700b3; color: white; flex: 1; font-size: 0.85rem; padding: 10px;">Play Orig 2</button>
            </div>
            
            <div class="slider-group">
                <label for="tempo-slider">Tempo: <span id="tempo-val">120</span> BPM</label>
                <input type="range" id="tempo-slider" min="20" max="180" value="120">
            </div>

            <div class="slider-group" style="background: #252525; padding: 10px; border-radius: 6px;">
                <label for="blend-slider" style="display: flex; justify-content: space-between; color: #03dac6;">
                    <span>Track 1</span>
                    <strong>Arranger Blend</strong>
                    <span>Track 2</span>
                </label>
                <input type="range" id="blend-slider" min="0.0" max="1.0" step="0.05" value="0.5">
            </div>

            <div class="slider-group">
                <label for="chaos-slider">Human Wander (Chaos): <span id="chaos-val">0.2</span></label>
                <input type="range" id="chaos-slider" min="0.0" max="1.0" step="0.1" value="0.2">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.58/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <script src="app.js"></script>
</body>
</html>
